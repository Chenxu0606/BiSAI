<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智策 - 智能旅行助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<video autoplay muted loop playsinline class="bg-video" oncanplay="this.playbackRate = 0.8">
    <source src="../static/videos/earth-flyover.mp4" type="video/mp4">
    您的浏览器不支持视频播放
</video>

<div class="login-container">
    <div class="swipe-container" id="swipeContainer">

        <div class="info-side">
            <div class="magazine-motto-wrapper">
                <div class="motto-text-block" id="infoLogin">
                    <p class="magazine-sub">-- Cadillac</p>
                    <h2 class="magazine-large">
                        <span class="line-1">一切伟大</span><br>
                        <span class="line-2">源于一个勇敢的开始</span>
                    </h2>
                </div>

                <div class="motto-text-block" id="infoRegister" style="display: none; opacity: 0;">
                    <p class="magazine-sub">-- MARK TWAIN</p>
                    <h2 class="magazine-large">
                        <span class="line-1">领先的秘诀</span><br>
                        <span class="line-2">就是开始</span>
                    </h2>
                </div>

                <div class="magazine-btn-area">
                    <button type="button" class="submit-btn outline-btn" id="toRegisterBtn">立即注册</button>
                    <button type="button" class="submit-btn outline-btn" id="toLoginBtn" style="display: none;">返回登录</button>
                </div>
            </div>

            <div class="neon-wave-container">
                <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                    <defs>
                        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                        <filter id="neon-glow">
                            <feGaussianBlur stdDeviation="2.5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <g class="parallax">
                        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(0, 122, 255, 0.3)" />
                        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(88, 86, 214, 0.5)" />
                        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(0, 199, 255, 0.8)" filter="url(#neon-glow)" />
                    </g>
                </svg>
            </div>
        </div>

        <div class="form-side glass-card">

            <div id="loginSection">
                <div class="logo-area">
                    <div class="logo-icon">Z</div>
                    <h1>智策</h1>
                    <p>立即开启您的专属智策</p>
                </div>

                <div class="alert" id="loginAlert"></div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label>用户名 / 邮箱</label>
                        <input type="text" id="username" placeholder="请输入账号">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <div class="pwd-box">
                            <input type="password" id="password" placeholder="请输入密码">
                            <button type="button" class="togglePwd">显示</button>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="loginBtn">登录</button>
                </form>
            </div>

            <div id="registerSection" style="display: none; opacity: 0;">
                <div class="logo-area">
                    <div class="logo-icon" style="background: linear-gradient(135deg, #5856D6, #AF52DE);">R</div>
                    <h1>新账号</h1>
                    <p>邀请您加入智策，开启专属旅行规划</p>
                </div>

                <div class="alert" id="registerAlert"></div>

                <form class="login-form" id="registerForm">
                    <div class="form-group">
                        <label>设置用户名</label>
                        <input type="text" id="regUsername" placeholder="建议使用常用邮箱">
                    </div>
                    <div class="form-group">
                        <label>设置密码</label>
                        <div class="pwd-box">
                            <input type="password" id="regPassword" placeholder="请输入密码">
                            <button type="button" class="togglePwd">显示</button>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" style="background: #5856D6;">完成注册</button>
                </form>
            </div>

        </div> </div> </div>

<script src="../static/script.js"></script>
</body>
</html>
