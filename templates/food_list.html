<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智策系统-餐厅列表页</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: #bdb6ec; /* 保持系统底色不变 */
            font-family: -apple-system, "PingFang SC", sans-serif;
        }

        /* 🌌 极光流动背景层 */
        #aurora-container {
            position: fixed; inset: 0; z-index: 0;
            filter: blur(100px); overflow: hidden; pointer-events: none;
        }
        .aurora-blob {
            position: absolute; width: 80vw; height: 80vw;
            border-radius: 50%; opacity: 0.65;
            mix-blend-mode: screen;
            animation: auroraMove 25s infinite alternate ease-in-out;
        }
        .blob-1 { background: #91defe; top: -15%; left: -10%; }
        .blob-2 { background: #efb3d5; bottom: -10%; right: -10%; }
        .blob-3 { background: #bdb6ec; top: 20%; right: 5%; }

        @keyframes auroraMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 15%) scale(1.1); }
        }

        /* 🫧 底层增强实体感的小透明泡泡 */
        #bg-bubble-canvas {
            position: fixed; inset: 0; z-index: 5; pointer-events: none;
        }
        .mini-bubble-wrapper {
            position: absolute; will-change: transform;
            opacity: 0; transform: scale(0);
            transition: opacity 0.8s, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .mini-bubble-wrapper.pop { opacity: 1; transform: scale(1); }
        .mini-bubble-core {
            width: 100%; height: 100%; border-radius: 50% !important;
            background: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.05) 40%, rgba(255, 255, 255, 0) 70%);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            box-shadow:
                inset 0 4px 12px rgba(255, 255, 255, 0.65),
                inset -3px -3px 10px rgba(0, 0, 0, 0.08),
                inset 0 0 4px rgba(255, 255, 255, 0.4),
                0 6px 15px rgba(74, 58, 137, 0.12);
            border: 0.5px solid rgba(255, 255, 255, 0.5);
        }

        /* 👑 顶部标题 */
        .header { position: fixed; top: 5%; width: 100%; text-align: center; color: #4a3a89; z-index: 100; pointer-events: none; }
        .page-title { font-size: 30px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(255,255,255,0.5); }

        /* 🎴 纵向翻滚动效容器 */
        .carousel-container {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            perspective: 2000px;
            z-index: 50; overflow: hidden;
        }

        .carousel-track {
            position: relative;
            width: 680px;
            height: 180px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* 💎 基础卡片样式 */
        .card-item {
            position: absolute; inset: 0;
            box-sizing: border-box;
            padding: 26px 32px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            will-change: transform, opacity, filter;

            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.65);

            box-shadow:
                inset 0 2px 2px rgba(255, 255, 255, 0.4),
                inset 0 -2px 6px rgba(255, 255, 255, 0.1),
                0 25px 45px rgba(74, 58, 137, 0.05);

            /* 这里的 transition 包含 backdrop-filter，保证切页时平滑过渡 */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                        background 0.4s,
                        border 0.4s,
                        opacity 0.6s,
                        backdrop-filter 0.6s,
                        filter 0.6s;
        }

        /* 🏷️ 文字排版 */
        .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .card-main-title { font-size: 24px; font-weight: 800; color: #35286a; margin: 0; line-height: 1.25; letter-spacing: 0.5px; }
        .card-score { font-size: 18px; color: #ffaf33; font-weight: 900; white-space: nowrap; }

        .card-address { font-size: 14px; color: #4e3f8a; font-weight: 500; opacity: 0.9; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 8px 0; }
        .card-badge-type { align-self: flex-start; background: rgba(255, 255, 255, 0.4); color: #3f317c; font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 12px; border: 0.5px solid rgba(255,255,255,0.6); }
    </style>
</head>
<body>

<div id="aurora-container">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
</div>

<div id="bg-bubble-canvas"></div>

<div class="header">
    <h1 class="page-title" id="city-title">探测结果加载中...</h1>
</div>

<div class="carousel-container" id="carousel-container">
    <div class="carousel-track" id="carousel-track">
        </div>
</div>

<script>
let bgBubbles = [];
let foodData = [];
let currentIndex = 0;
let isScrolling = false;

// 1. 底层透明实体泡泡
class MiniBubble {
    constructor() {
        this.r = 12 + Math.random() * 20;
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.wrapper = document.createElement('div');
        this.wrapper.className = 'mini-bubble-wrapper';
        this.wrapper.style.width = this.wrapper.style.height = (this.r * 2) + 'px';
        const core = document.createElement('div');
        core.className = 'mini-bubble-core';
        this.wrapper.appendChild(core);
        document.getElementById('bg-bubble-canvas').appendChild(this.wrapper);
        setTimeout(() => this.wrapper.classList.add('pop'), 50);
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < -this.r * 2) this.x = window.innerWidth + this.r;
        if (this.x > window.innerWidth + this.r) this.x = -this.r;
        if (this.y < -this.r * 2) this.y = window.innerHeight + this.r;
        if (this.y > window.innerHeight + this.r) this.y = -this.r;
        this.wrapper.style.transform = `translate3d(${this.x - this.r}px, ${this.y - this.r}px, 0)`;
    }
}

function initBg() {
    for (let i = 0; i < 18; i++) bgBubbles.push(new MiniBubble());
    function loop() { bgBubbles.forEach(b => b.update()); requestAnimationFrame(loop); }
    loop();
}

// 2. 3D 纵向翻滚卡片渲染
function renderVerticalCarousel() {
    const track = document.getElementById('carousel-track');
    track.innerHTML = '';

    foodData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
            <div>
                <div class="card-top-row">
                    <h2 class="card-main-title">${item.name}</h2>
                    <div class="card-score">★ ${item.score || '0.0'}</div>
                </div>
                <div class="card-address">地址： ${item.address || '暂无详细探测地址'}</div>
            </div>
            <div class="card-badge-type">${item.type || '未分类'}</div>
        `;

        card.onclick = () => {
            if (index === currentIndex) {
                window.location.href = `/food/detail?name=${encodeURIComponent(item.name)}`;
            } else {
                currentIndex = index;
                updatePositions();
            }
        };
        track.appendChild(card);
    });
    updatePositions();
}

// 🌟 核心优化：动态开关模糊、拉大垂直距离，斩断一切重影
function updatePositions() {
    const cards = document.querySelectorAll('.card-item');
    cards.forEach((card, index) => {
        const offset = index - currentIndex;

        if (offset === 0) {
            // 🎯 当前聚焦卡片：独享极致高级毛玻璃效果
            card.style.transform = `translateY(0) translateZ(260px) rotateX(0deg)`;
            card.style.zIndex = 100;
            card.style.opacity = 1;
            card.style.pointerEvents = 'auto';
            card.style.backdropFilter = 'blur(60px)';
            card.style.webkitBackdropFilter = 'blur(60px)';
            card.style.filter = 'blur(0px)';
        } else if (Math.abs(offset) === 1) {
            // 📐 上下紧邻的第一级隐藏卡片：拉大纵向位移（150px），并且关掉模糊，防止边缘堆叠产生重影
            const dir = offset > 0 ? 1 : -1;
            const translateY = dir * 150; // 加大垂直间距，彻底分家
            const translateZ = -150;
            const rotateX = dir * 25;

            card.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${rotateX}deg) scale(0.95)`;
            card.style.zIndex = 50;
            card.style.opacity = 0.45; // 足够轻薄干净
            card.style.pointerEvents = 'auto';

            // 核心清爽化：去掉卡片自身的 backdrop-filter 磨砂层，防止和中间卡片的模糊叠加产生死角重影
            card.style.backdropFilter = 'none';
            card.style.webkitBackdropFilter = 'none';
            card.style.filter = 'blur(0px)';
        } else {
            // ❌ 更远处的卡片：为了绝对杜绝多层叠加导致的杂乱重影，直接让其完全淡出不作展示
            card.style.opacity = 0;
            card.style.pointerEvents = 'none';
            card.style.transform = `translateY(${offset > 0 ? 250 : -250}px) translateZ(-300px)`;
        }
    });
}

// 3. 鼠标滚轮支持
const container = document.getElementById('carousel-container');
container.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (isScrolling) return;

    if (e.deltaY > 0) {
        if (currentIndex < foodData.length - 1) {
            currentIndex++;
            triggerTrackChange();
        }
    } else if (e.deltaY < 0) {
        if (currentIndex > 0) {
            currentIndex--;
            triggerTrackChange();
        }
    }
}, { passive: false });

function triggerTrackChange() {
    isScrolling = true;
    updatePositions();
    setTimeout(() => { isScrolling = false; }, 260); // 略微加快响应，让切换更清脆
}

// 4. 手势支持兜底
let startY = 0;
container.onmousedown = e => startY = e.clientY;
container.onmouseup = e => {
    const diff = e.clientY - startY;
    if (Math.abs(diff) > 40) {
        if (diff > 0 && currentIndex > 0) currentIndex--;
        if (diff < 0 && currentIndex < foodData.length - 1) currentIndex++;
        updatePositions();
    }
};

// 5. 初始化加载
async function loadFoodList() {
    initBg();
    const city = new URLSearchParams(window.location.search).get('city') || "广州";
    document.getElementById('city-title').innerText = `${city} · 餐厅基因库`;

    try {
        const res = await fetch(`/api/food/list_data?city=${encodeURIComponent(city)}`);
        const result = await res.json();
        if (result.code === 200 && result.data.length > 0) {
            foodData = result.data;
            currentIndex = Math.floor(foodData.length / 2);
            renderVerticalCarousel();
        }
    } catch (e) {
        foodData = [
            {name: "陶陶居·百年传承", score: "4.9", type: "经典粤菜", address: "广州市天河区天河路228号正佳广场6层"},
            {name: "点都德·大茶楼", score: "4.8", type: "特色茶点", address: "广州市越秀区中山四路246号"},
            {name: "惠食佳·啫啫煲", score: "4.7", type: "地道粤菜", address: "广州市海珠区滨江东路172号"},
            {name: "滋粥仔·海鲜打边炉", score: "4.9", type: "顺德风味", address: "广州市番禺区迎宾路248号"},
            {name: "文记壹心鸡", score: "4.6", type: "探店小吃", address: "广州市荔湾区宝华路旋源桥10号"}
        ];
        currentIndex = 2;
        renderVerticalCarousel();
    }
}
window.onload = loadFoodList;
</script>
</body>
</html>
